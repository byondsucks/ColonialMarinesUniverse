# ── Survivor weapon variants (loadout-only) ───────────────────────────────────────────────────────────
# The CMU tactical MAR-30/MAR-40 ship with a suppressor, a two-point sling and an angled grip. The survivor
# loadouts want the sling swapped for a reflex sight; everything else is inherited unchanged.

- type: entity
  parent: AU14WeaponRifleMAR30Tactical
  id: CMUWeaponRifleMAR30Tactical
  name: Tactical MAR-30 battle carbine
  components:
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        startingAttachable: RMCAttachmentSuppressor
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCM5Bayonet
      rmc-aslot-rail:
        startingAttachable: RMCAttachmentS6ReflexSight
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentS84xTelescopicScope
      rmc-aslot-underbarrel:
        startingAttachable: RMCAttachmentAngledGrip
        whitelist:
          tags:
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentExtinguisher
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentFlamer
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentLaserSight

