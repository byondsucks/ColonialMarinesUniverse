# MK221 handed out already loaded: the base WeaponShotgunM890 spawns with an empty tube, which reads as a
# broken weapon to a survivor who has just been issued it.
- type: entity
  parent: WeaponShotgunM890
  id: CMUWeaponShotgunM890Filled
  name: MK221 tactical shotgun
  suffix: Filled
  components:
  - type: BallisticAmmoProvider
    proto: CMShellShotgunBuckshot
