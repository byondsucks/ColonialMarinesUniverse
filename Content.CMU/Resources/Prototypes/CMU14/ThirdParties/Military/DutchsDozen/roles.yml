# Arnold wears a Yautja clan mask, a tech item, so every bracer's gear tracker points the hunters straight at him
# Arnold's machete is the M2100 "Ngájhe" (cmss13 /obj/item/weapon/sword/machete/arnold), not the issue M2132.
# The scabbard's slot whitelist takes the `Machete` tag, and RMCM2100Machete only carries its own id tag - so
# the blade could be drawn but never put back. This subtype adds the tag the scabbard asks for.
- type: entity
  parent: RMCM2100Machete
  id: CMUM2100MacheteArnold
  components:
  - type: Tag
    tags:
    - RMCM2100Machete
    - Machete

- type: entity
  parent: RMCScabbardMachete
  id: CMUScabbardMacheteArnoldFilled
  suffix: Filled, Arnold
  components:
  - type: ContainerFill
    containers:
      item:
      - CMUM2100MacheteArnold

- type: startingGear
  parent: CMUGearDutchsDozenBase
  id: CMUGearDutchsDozenArnold
  equipment:
    head: RMCArmorHelmetDutchCap
    # cmss13 gives Arnold clothing/glasses/thermal/empproof.
    eyes: CMUOpticalThermalScanner
    mask: CMUYautjaMask
    back: CMUScabbardMacheteArnoldFilled
    suitstorage: CMUWeaponRifleXM177Dutch
    belt: CMUBeltMarineFilledM16APDutch
    pocket1: CMUPouchExplosiveFilledDutchEMP
    pocket2: RMCPouchMedicalSocDutchFill
    id: CMUIDCardDutchsDozenArnold
  storage:
    outerClothing:
    - CMUMagazineRifleM16AP
    - CMUMagazineRifleM16AP

# cmss13's /obj/item/clothing/glasses/thermal/empproof, which Arnold's preset wears.
#
# Upstream ClothingEyesGlassesThermal does nothing in CMU: it depends on the SS14 thermal shader, which this fork
# does not run (the Yautja mask's thermal vision is a Yautja-only component, replaced there by x-ray). These are
# therefore built on the working RMC night-vision item - CMGlassesM42ScoutSight carries NightVisionItem with a
# toggle action - with the non-green palette so the result reads as thermal imaging. Art, name and description
# are cmss13's own.
# Toggle action owned by the thermal goggles.
- type: entity
  parent: ActionMarineBase
  id: CMUActionToggleThermalGoggles
  name: Toggle thermal goggles
  description: Switch the thermal imaging goggles on or off.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: CMGlassesM42ScoutSight
  id: CMUOpticalThermalScanner
  name: Optical Thermal Scanner
  description: Thermals in the shape of glasses. This one is EMP proof.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/Dutch/thermal_scanner.rsi
    layers:
    - state: icon
      map: [ "icon" ]
  - type: Clothing
    sprite: CMU14/Clothing/Dutch/thermal_scanner.rsi
  - type: NightVisionItem
    actionId: CMUActionToggleThermalGoggles
    enableOnEquip: false
    green: false
    defaultState: Full
    blockScopes: true
  - type: GenericVisualizer
    visuals:
      enum.NightVisionItemVisuals.Active:
        icon:
          True: { state: icon_on }
          False: { state: icon }

# The Broiler-T with an incinerator already fitted. cmss13's /obj/item/storage/large_holster/broiler ships as a
# harness you sheath the flamer into; the slot below is that sheath, pre-filled for the Dozen's flamethrower.
- type: entity
  parent: RMCBackpackBroiler
  id: CMUBackpackBroilerFlamer
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      item:
        name: Incinerator
        startingItem: RMCWeaponFlamerSpec
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        whitelist:
          tags:
          - RMCWeaponIncineratorM34T

# cmss13's Dutch's Dozen uniform has no sleeve folding: /obj/item/clothing/under/marine/veteran/dutch just sets
# worn_state = "dutch_jumpsuit". RMC14's version inherits RMCFoldableUniformBase, which starts folded and draws
# rolled sleeves with an arm colour baked into the sprite. Same sprites, no Foldable component.
- type: entity
  parent: RMCMarineUniformBase
  id: CMUJumpsuitDutch
  name: Dutch's Dozen uniform
  description: A comfortable uniform worn by the Dutch's Dozen mercenaries. It's seen some definite wear and tear,
    but is still in good condition.
  components:
  # Ported verbatim from cmss13: misc_ert_colony.dmi state dutch_jumpsuit (worn) and its obj counterpart (icon),
  # replacing RMC14's foldable copy. The sleeves are part of the uniform art upstream.
  - type: Sprite
    sprite: CMU14/Clothing/Dutch/jumpsuit.rsi
  - type: Clothing
    sprite: CMU14/Clothing/Dutch/jumpsuit.rsi

# Survivor-only machine gunner. The call-in squad keeps CMUMobDutchsDozenMachineGunner; this body exists so the
