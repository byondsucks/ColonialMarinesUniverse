# the M240A2 stands in for the M240 spec flamer, the M16A1 for the XM177
- type: startingGear
  parent: CMUGearDutchsDozenBase
  id: CMUGearDutchsDozenFlamer
  equipment:
    # cmss13: the M240-T rides in the Broiler-T harness on the back, with the fuel-tank strap pouch in a pocket
    # and an XM177 as the primary. The harness carries the incinerator in its own slot (it has no Storage at all),
    # which is why CMUBackpackBroilerFlamer overrides that slot's starting item.
    back: CMUBackpackBroilerFlamer
    suitstorage: CMUWeaponRifleXM177Dutch
    belt: CMUBeltMarineFilledM16APDutch
    pocket1: CMUPouchFuelTankFilledDutch
    id: CMUIDCardDutchsDozenFlamer
  storage:
    outerClothing:
    - CMUGrenadeEMPDutch
    - CMUGrenadeEMPDutch
    # The harness fills its own tank slots; only the loose kit goes in pockets.
  # No in-hand rifle: the survivor loadout already equips the rifle the player picks, and a second one in his
  # hands would never be converted or cleaned up (the loadout only looks at suit storage, back and belt).

