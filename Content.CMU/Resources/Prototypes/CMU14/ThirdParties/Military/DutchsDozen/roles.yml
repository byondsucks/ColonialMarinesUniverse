- type: entity
  parent: CMUBaseMobDutchsDozen
  id: CMUMobDutchsDozenArnold
  name: Arnold 'Dutch' Schäfer
  components:
  # cmss13 /datum/equipment_preset/dutch/arnie/load_name: male, 38, "Mulder" hair, "5 O'clock Shadow"
  # facial hair, hair 15/15/25 (near-black blue), eyes 139/62/19 (amber).
  - type: RandomHumanoidAppearance
    randomizeName: false
    sex: Male
    age: 38
    hair: RMCHumanHairMulder
    facialHair: HumanFacialHairFiveoclock
    hairColor: "#0f0f19"
    eyeColor: "#8b3e13"
    # cmss13 never sets a skin tone for Arnold (load_name covers gender, name, hair style/colour, eyes and age
    # only), so the tone fell through to human.dm's 0,0,0 fallback and read as black. Pinned to a mid tan instead,
    # matching the character, so it is also identical every round.
    skinColor: "#B69B78"
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-dutchs-dozen-name-arnold
    description: cmu-dutchs-dozen-ghost-description-arnold
    rules: cmu-dutchs-dozen-ghost-rules
    reregister: false
    job: CMUJobDutchsDozenArnold
    raffle:
      settings: short

