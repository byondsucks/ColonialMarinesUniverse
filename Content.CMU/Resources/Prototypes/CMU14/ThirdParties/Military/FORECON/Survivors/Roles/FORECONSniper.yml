  id: AU14FORECONSniper
  roundSide: ThirdParty
  roundForce: FORECON
  roundRole: AU14FORECONSniper
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spec
    background:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_forecon
  - type: NpcFactionMember
    factions:
    - GOVFOR
  - type: AssignSquad
    whitelist:
      tags:
      - RMCSquadFORECON
  - type: Skills
    preset: AU14SkillPresetPlatoonRifleman
  - type: ScoutWhitelist
  - type: SpotterWhitelist
  - type: JobPrefix
    prefix: rmc-job-prefix-forecon-marksman
  - type: LanguagePreset
    spokenLanguages:
    - English
    - TacticalSignLanguage
    understoodLanguages:
    - English
    - TacticalSignLanguage
    currentLanguage: English
    defaultLanguage: English

  name: rmc-job-name-forecon-sniper
  description: rmc-job-description-forecon
  playTimeTracker: AU14JobFORECONSniper
  ranks:
    RMCRankCivilian: []
  spawnMenuRoleName: FORECON Sniper (AU14, surv)
  startingGear: AU14GearFORECONSniper
  greeting: au14-forecon-greeting
  icon: "CMJobIconEmpty"
  joinNotifyCrew: false
  supervisors: cm-job-name-squad-leader
  accessGroups:
  - AU14GovforSquad
  hidden: false

- type: entity
  parent: AU14BaseMobSpeciesOrganicFORECON
  id: AU14JobFORECONSniper
  name: FORECON Sniper (Surv)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: SquadFORECON
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: rmc-job-name-forecon-sniper
    description: rmc-job-description-forecon
    reregister: false
    job: AU14FORECONSniper
    raffle:
      settings: short
    rules: au14-forecon-rules

# cmss13's forecon sniper wears the ghillie suit over the recon uniform and carries a general belt instead of the
# jacket flashlight; CMU has no general belt, so the pack keeps the survivor satchel.
- type: startingGear
  id: AU14GearFORECONSniper
  equipment:
    id: AU14IDCardFORECONMarksman
    outerClothing: AU14ArmorGhillie
    jumpsuit: RMCJumpsuitSurvivorMarineDropPouch
    shoes: RMCScoutShoes
    head: AU14HelmetGhillie
    belt: AU14BeltPostelPistolM48A4
    pocket1: AU14PouchIFAKFill
    pocket2: AU14PouchIFAKFill
    back: RMCSatchelMarineForeconSurvivorFill
    ears: RMCHeadsetForecon
    suitstorage: WeaponRifleM4SPRCustom
  storage:
    back:
    - RMCAttachmentRailFlashlight
    - RMCMagazineRifleM4SPRA19
    - RMCMagazineRifleM4SPRA19
    - RMCMagazineRifleM4SPRA19
    # cmss13's FORECON survivor baseline: flask, facepaint, an MRE and a pry tool, on top of the role's kit.
    - CMMarineFlask
    # Facepaint: cmss13's sniper facepaint has no CMU prototype yet (RMCFacepaint is still a TODO upstream).
    - CMMRE
    - CMCrowbar

- type: playTimeTracker
  id: AU14JobFORECONSniper
