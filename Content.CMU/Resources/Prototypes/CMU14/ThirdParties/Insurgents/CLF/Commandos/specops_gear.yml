    shoes: RMCBootsPMCCommandoFilled
    gloves: RMCHandsCombat
    ears: AU14HeadsetCLF
    head: CMU14CLFCommandoHelmet
    outerClothing: CMU14CLFCommandoArmor
    belt: AU14BeltUtilityCombatProdigyRUFilled
    back: RMCBackpackWelderPMC
    pocket1: RMCPouchFirstAidERTFill
  inhand:
  - RMCWeaponRifleM16A5
  storage:
    back:
    - RMCMRECLF
    - CMGrenadeHighExplosive
    - RMCMagazineRifleM16
    - CMBeltUtilityFilled
    outerClothing:
    - RMCMagazineRifleM16

