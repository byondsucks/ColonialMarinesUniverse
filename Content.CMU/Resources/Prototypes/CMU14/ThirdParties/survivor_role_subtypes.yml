# =====================================================================================================
# Survivor spawn templates for factions whose shared spawn is also used by a non-survivor party.
# The U.S. Army and FORECON survivor parties reuse their existing spawn templates, updated in place to
# the survivor role prototypes above.
# =====================================================================================================

- type: partySpawn
  id: CMUSurvivorSpawnWyPmc
  # The W-Y PMC survivor group is the Solaris Ridge crash-landing detachment: exactly one body per
  # position (commander, squad leader, medic, technician, liaison, synthetic support, rifleman). The
  # corporate squad party (WYPMCParty) and its roles are a separate call-in and are not mixed in here.
  leadersToSpawn:
    CMUSurvivorWyPmcFieldOpsLeader: 1 # commander position
    CMUSurvivorWyPmcLeader: 1 # squad leader
  gruntsToSpawn:
    CMUSurvivorWyPmcMedic: 1
    CMUSurvivorWyPmcEngineer: 1
    CMUSurvivorWyPmcSupervisor: 1
    CMUSurvivorWyPmcSynth: 1
    CMUSurvivorWyPmcStandard: 1
  scalewithpop: false
  spawnTogether: true

- type: partySpawn
  id: CMUSurvivorSpawnClfCommando
  leadersToSpawn:
    CMUSurvivorClfSpecOpsLeader: 1
  gruntsToSpawn:
    CMUSurvivorClfSpecOpsOperative: 3
    CMUSurvivorClfSpecOpsMedic: 1
    CMUSurvivorClfSpecOpsTechnician: 1
    CMUSurvivorClfSpecOpsHeavy: 1
  scalewithpop: false
  spawnTogether: true

- type: partySpawn
  id: CMUSurvivorSpawnFreeCompany
  leadersToSpawn:
    CMUSurvFreeCompanyLeader: 1
  gruntsToSpawn:
    CMUSurvFreeCompanyRaider: 2
  scalewithpop: false
  spawnTogether: true

- type: partySpawn
  id: CMUSurvivorSpawnUnisc
  leadersToSpawn:
    CMUSurvUniscPlatoonOps: 1
    CMUSurvUniscSquadLeader: 1
  gruntsToSpawn:
    CMUSurvUniscRifleman: 1
    CMUSurvUniscAutomaticRifleman: 1
    CMUSurvUniscCorpsman: 1
    CMUSurvUniscEnforcer: 2
    CMUSurvUniscEnforcerLeader: 1
    CMUSurvUniscObserver: 1
  scalewithpop: false
  spawnTogether: true
