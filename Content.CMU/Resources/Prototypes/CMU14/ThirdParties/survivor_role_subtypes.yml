# Survivor-only role subtypes and spawn templates.
#
# Each supported survivor faction gets its own role prototypes, inheriting the shared role they replace so
# equipment, appearance, faction, skills and other configuration stay identical. Survivor spawn templates
# reference only these prototypes, so changing survivor roles can never leak into ERTs, insurgency call-ins
# or other third-party deployments.
#
# Naming: CMUSurvivor<Faction><Role>. The parent role is the shared prototype the survivor variant replaces.

# =====================================================================================================
# U.S. ARMY
# =====================================================================================================
- type: entity
  parent: AU14JobUSArmyCommander
  id: CMUSurvivorUSArmyCommander
  components:
  # The survivor commander carries high-impact Mateba loaders (see USArmySurvivorSidearm.yml).
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: rmc-job-name-forecon-commander
    description: cm-job-description-commanding-officer
    reregister: false
    job: CMUJobUSArmySurvCommander
    raffle:
      settings: short
    rules: au14-usarmy-rules

- type: entity
  parent: AU14JobUSArmySquadleader
  id: CMUSurvivorUSArmySquadLeader

- type: entity
  parent: AU14JobUSArmyCMT
  id: CMUSurvivorUSArmyMedic

- type: entity
  parent: AU14JobUSArmyCET
  id: CMUSurvivorUSArmyTechnician

- type: entity
  parent: AU14JobUSArmyHeavyGunner
  id: CMUSurvivorUSArmyHeavyGunner

- type: entity
  parent: AU14JobUSArmyMarksman
  id: CMUSurvivorUSArmyMarksman

- type: entity
  parent: AU14JobUSArmySynth
  id: CMUSurvivorUSArmySynth

- type: entity
  parent: AU14JobUSArmyTrooper
  id: CMUSurvivorUSArmyRifleman

