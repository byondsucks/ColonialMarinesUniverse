# Which composition position each survivor role body fills.
#
# A faction's party spawn (thirdParty -> partyspawn) decides which survivor roles exist and how many.
# This table classifies those role bodies so the survivor group can be composed in priority order:
#   Commander -> Squad Leader -> Medic -> Technician -> Weapon Specialist -> Liaison -> Riflemen
#
# Every position is filled at most once and never with the same role body twice. A faction without a
# position simply skips it; nobody is given an invented role. Everyone left over becomes a Rifleman,
# repeating the faction's primary rifleman body when the group is larger than the original template.
#
# Categories:
#   Commander / SquadLeader - explicit leadership positions (a faction can have both)
#   Leader                  - generic leadership: fills Commander first, then SquadLeader if there is a
#                             second leader body (used by factions whose leader is just "Leader")
#   Medic / Technician      - support positions
#   WeaponSpecialist        - the faction's smartgunner / heavy gunner / marksman / pilot equivalent
#   Liaison                 - faction-specific non-combat VIP
#   Rifleman                - fills the rest of the group; the first one in template order is the overflow body
#   Support                 - template body that is not part of the survivor composition (synth, scientist)
#
# Roles without an entry default to generic leadership in a party spawn's leadersToSpawn and Rifleman in
# gruntsToSpawn, so adding a survivor faction needs no code.

# --- Weyland-Yutani ---
- type: survivorRole
  id: AU14JobWYSurvPMC
  category: Commander
- type: survivorRole
  id: AU14JobWYSurvLiaison
  category: Liaison
- type: survivorRole
  id: AU14JobWYSurvEngineer
  category: Technician
- type: survivorRole
  id: AU14JobWYSurvScientist
  category: Support
- type: survivorRole
  id: AU14JobWYSurvGoon
  category: Rifleman
- type: survivorRole
  id: AU14JobWYSurvGoonShotgun
  category: Rifleman

