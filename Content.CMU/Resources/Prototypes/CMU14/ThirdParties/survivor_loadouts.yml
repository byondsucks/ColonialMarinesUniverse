    - CMU14CLFCommandoHelmet
    - CMU14CLFSpecOpsHelmetRiot
    CMUSurvivorClfSpecOpsOperative:
    - CMU14CLFCommandoHelmet
    - CMU14CLFSpecOpsHelmetRiot
    CMUSurvivorClfSpecOpsMedic:
    - CMU14CLFCommandoHelmet
    - CMU14CLFSpecOpsHelmetRiot
    CMUSurvivorClfSpecOpsTechnician:
    - CMU14CLFCommandoHelmet
    - CMU14CLFSpecOpsHelmetRiot
    CMUSurvivorClfSpecOpsHeavy:
    - CMU14CLFSpecOpsHelmetHeavy

# --- U.S. ARMY ---
- type: survivorLoadout
  id: CMUSurvivorLoadoutUsArmy
  # The commander wears a Mateba autorevolver on the belt with 1-3 high-impact and 1-3 standard loads.
  commanderRoles:
  - CMUSurvUSArmyCommander
  commanderSidearm: RMCWeaponRevolverMateba
  commanderSidearmAmmo:
  - RMCSpeedLoaderMateba
  commanderSidearmHighImpactAmmo:
  - RMCSpeedLoaderMatebaHighImpact
  # The commander's magazine pouch takes four magazines, matching the fill the kit shipped before the loadout
  # stocked it (the survivor upgrade then converts one to three of those four to AP).
  roleMagazineIssue:
    CMUSurvUSArmyCommander: 4
  factions:
  - USArmy
  - USArmyAlt
  - USArmyAlt2
  - CMUUSArmySurvivors
  armor:
  - AU14ArmorUSArmy
  - AU14ArmorUSArmyNormal
  - AU14ArmorSmartGunJungleCombatHarnessForeconFilled
  helmets:
  - AU14HelmetUSArmy
  - AU14BeretUSArmy
  - AU14HatUSArmy
  firearms:
  - RMCWeaponRifleM54C
  - RMCWeaponShotgunM37A1Filled
  - WeaponSMGM63
  - WeaponRifleM4SPRCustom
  - RMCSmartGun
  firearmAmmo:
    # These ship with an empty magazine well, so the loadout states which magazine they feed.
    RMCWeaponRifleM54C: CMMagazineRifleM54C
    WeaponSMGM63: CMMagazineSMGM63
  roleFirearms:
    CMUSurvUSArmyHeavyGunner:
    - RMCSmartGun
    CMUSurvUSArmyMarksman:
    - WeaponRifleM4SPRCustom
    - WeaponRifleM4SPRFilled
    - RMCWeaponRifleM54C
    - RMCWeaponShotgunM37A1Filled
    - WeaponSMGM63
  firearmRoles:
    # The marksman rifle is offered to weapon specialists only.
    WeaponRifleM4SPRCustom:
    - WeaponSpecialist
    RMCSmartGun:
    - WeaponSpecialist
  roleArmor:
    CMUSurvUSArmyCommander:
    # He wears the dress service jacket, so the armour vest is not one of his options.
    - RMCCoatCOServiceJacketGreen
    CMUSurvUSArmySquadLeader:
    - AU14ArmorUSArmy
    CMUSurvUSArmySynth:
    - AU14ArmorUSArmyNormal
    CMUSurvUSArmyTechnician:
    - AU14ArmorUSArmyNormal
    CMUSurvUSArmyMedic:
    - AU14ArmorUSArmyNormal
    CMUSurvUSArmyHeavyGunner:
    - AU14ArmorSmartGunJungleCombatHarnessForeconFilled
    CMUSurvUSArmyMarksman:
    - AU14ArmorUSArmy
    CMUSurvUSArmyRifleman:
    - AU14ArmorUSArmyNormal
  roleHelmets:
    CMUSurvUSArmyCommander:
    - AU14BeretUSArmy
    CMUSurvUSArmySquadLeader:
    - AU14BeretUSArmy
    CMUSurvUSArmySynth:
    - AU14HelmetUSArmy
    CMUSurvUSArmyTechnician:
    - AU14HelmetUSArmy
    CMUSurvUSArmyMedic:
    - AU14HelmetUSArmy
    CMUSurvUSArmyHeavyGunner:
    - AU14HelmetUSArmy
    CMUSurvUSArmyMarksman:
    - AU14HelmetUSArmy
    CMUSurvUSArmyRifleman:
    - AU14HelmetUSArmy

# --- FORECON ---
# Same weapon pool as the Army. The thermal poncho is the marksman's; everyone else wears light armor
# or the webbing harness, and picks their own headgear from boonie/cap/helmet.
- type: survivorLoadout
  id: CMUSurvivorLoadoutForecon
  # The commander wears a Mateba autorevolver on the belt with 1-3 high-impact and 1-3 standard loads.
  commanderRoles:
  - CMUSurvForeconCommander
  commanderSidearm: RMCWeaponRevolverMateba
  commanderSidearmAmmo:
  - RMCSpeedLoaderMateba
  commanderSidearmHighImpactAmmo:
  - RMCSpeedLoaderMatebaHighImpact
  factions:
  - FORECON
  - FORECONAlt
  - FORECONAlt2
  - CMUFORECONSurvivors
  armor:
  - AU14ArmorM3RForecon
  - RMCOuterClothingExternalWebbingForeconSurvivorFill
  - RMCArmorUDEPForecon
  helmets:
  - ArmorHelmetM10
  - RMCHeadCapFlippable
  - RMCBoonieTan
  firearms:
  - RMCWeaponRifleM54C
  - RMCWeaponShotgunM37A1Filled
  - WeaponSMGM63
  - WeaponRifleM4SPRCustom
  - RMCSmartGun
  # The M39 (WeaponSMGM63) ships without a starting magazine, so the loadout has to state which one it feeds.
  # Without this the survivor kept whatever primary ammunition their gear came with (M4RA) and the gun was empty.
  firearmAmmo:
    # These ship with an empty magazine well, so the loadout states which magazine they feed.
    RMCWeaponRifleM54C: CMMagazineRifleM54C
    WeaponSMGM63: CMMagazineSMGM63
  roleFirearms:
    CMUSurvForeconSmartGunner:
    - RMCSmartGun
    CMUSurvForeconSniper:
    - WeaponRifleM4SPRCustom
    - WeaponRifleM4SPRFilled
    CMUSurvForeconMarksman:
    - WeaponRifleM4SPRCustom
    - WeaponRifleM4SPRFilled
    - RMCWeaponRifleM54C
    - RMCWeaponShotgunM37A1Filled
    - WeaponSMGM63
  firearmRoles:
    # The marksman rifle is offered to weapon specialists only.
    WeaponRifleM4SPRCustom:
    - WeaponSpecialist
    RMCSmartGun:
    - WeaponSpecialist
  roleArmor:
    CMUSurvForeconMarksman:
    - RMCArmorUDEPForecon
    CMUSurvForeconSniper:
    - AU14ArmorGhillie
    CMUSurvForeconCommander:
    - AU14ArmorM3RForecon
    - RMCOuterClothingExternalWebbingForeconSurvivorFill
    CMUSurvForeconSquadLeader:
    - AU14ArmorM3RForecon
    - RMCOuterClothingExternalWebbingForeconSurvivorFill
    CMUSurvForeconMedic:
    - AU14ArmorM3RForecon
    - RMCOuterClothingExternalWebbingForeconSurvivorFill
    CMUSurvForeconSynth:
    - AU14ArmorM3RForecon
    - RMCOuterClothingExternalWebbingForeconSurvivorFill
    CMUSurvForeconTechnician:
    - AU14ArmorM3RForecon
    - RMCOuterClothingExternalWebbingForeconSurvivorFill
    CMUSurvForeconSmartGunner:
    - AU14ArmorSmartGunJungleCombatHarnessForeconFilled
    CMUSurvForeconRifleman:
