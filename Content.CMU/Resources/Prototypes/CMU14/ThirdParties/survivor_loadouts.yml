# Faction-specific survivor loadouts.
#
# Each prototype configures the armor, helmet and firearm options one survivor faction offers after the
# group faction vote. `factions` lists the third-party survivor party prototypes that share the loadout
# (size variants and round-start survivor parties share their faction's equipment).
#
# Every id below must be a real entity prototype; SurvivorLoadoutSystem validates them on load and logs
# missing references. Add, remove or reorder options here without touching any code: the selection UI,
# server-side validation and spawn equipment all read this data.

# --- PRODIGY PMC ---
- type: survivorLoadout
  id: CMUSurvivorLoadoutProdigy
  factions:
  - CMUProdigySurvivors
  armor:
  - CMUArmorProdigyFlakVest
  - CMUArmorProdigyFlakVestAlt
  - CMUArmorProdigyFlakVestMedical
  helmets:
  - AU14ProdigyBallisticHelmet
  - AU14ProdigyCap
  - AU14ProdigyBeret
  - AU14ProdigyBallisticHelmetPART
  - AU14ProdigyBeretPART
  - CMU14ProdigyCapGrey
  # The shotgun is the military HG 37-12: cmss13 /obj/item/weapon/gun/shotgun/pump/dual_tube/cmb/m3717.
  firearms:
  - AU14WeaponRifleprodigyrifleAR
  - RMCWeaponShotgunM3717
  - RMCWeaponSMGM63ExtendedFilled
  roleArmor:
    CMUSurvProdigyGuardLeader:
    - CMUArmorProdigyFlakVest
    CMUSurvProdigyGuardMedic:
    - CMUArmorProdigyFlakVestMedical
    CMUSurvProdigyGuard:
    - CMUArmorProdigyFlakVest
    - CMUArmorProdigyFlakVestAlt
    CMUSurvProdigyLiaison:
    - CMUArmorProdigyFlakVest
  roleHelmets:
    CMUSurvProdigyGuardLeader:
    - AU14ProdigyBeret
    - AU14ProdigyBallisticHelmet
    - CMU14ProdigyCapGrey
    CMUSurvProdigyGuardMedic:
    - AU14ProdigyBallisticHelmet
    - CMU14ProdigyCapGrey
    CMUSurvProdigyGuard:
    - AU14ProdigyBallisticHelmet
    - AU14ProdigyCap
    - CMU14ProdigyCapGrey
    CMUSurvProdigyLiaison:
    - AU14ProdigyCap
    - CMU14ProdigyCapGrey

# --- W-Y PMC ---
- type: survivorLoadout
  id: CMUSurvivorLoadoutWyPmc
  factions:
  - WEYUSurvSmall
  - WEYUSurvMedium
  - WEYUSurvLarge
  - CMUWYPMCSurvivors
  armor:
  - AU14WYPMCArmor
  - AU14WYPMCArmorMin
  - AU14WYPMCArmorEngineer
  helmets:
  - AU14ArmorHelmetPMCTactical
  - AU14WYPMCHelmet
  - AU14WYPMCHelmetHeavy
  firearms:
  - RMCWeaponRifleM54C2
  - RMCWeaponSMGM63B2
  - RMCWeaponRifleSSG45
  - CMUWeaponShotgunM890Filled
  firearmAmmo:
    CMUWeaponShotgunM890Filled: CMShellShotgunBuckshot
  # The Field Commander is issued five M39 magazines; the survivor ammunition upgrade then converts one to three of
  # those five to AP, so the rig always holds five magazines with a 1-3 AP mix.
  roleMagazineIssue:
    CMUSurvivorWyPmcFieldOpsLeader: 5
  # The Solaris Ridge crash-landing roles wear their own kit: armor and helmet are fixed per role, while the
  # firearm stays a pick from the faction list above (M54C2 / M63B2 / NSG-23). Roles without an entry here
  # keep the faction-wide armor and helmet lists.
  roleArmor:
    CMUSurvivorWyPmcStandard:
    - CMArmorM4PMCLight
    - AU14WYPMCArmor
    CMUSurvivorWyPmcMedic:
    - CMArmorM4PMCLight
    CMUSurvivorWyPmcEngineer:
    - RMCArmorM4PMCEngineer
    CMUSurvivorWyPmcLeader:
    - CMArmorM4PMCLeader
    CMUSurvivorWyPmcFieldOpsLeader:
    - CMArmorM4PMCLeader
    CMUSurvivorWyPmcSupervisor:
    - RMCJacketCorporateManager
    CMUSurvivorWyPmcSynth:
    - CMArmorM4PMCSynth
  roleHelmets:
    CMUSurvivorWyPmcStandard:
    - ArmorHelmetPMC
    - AU14WYPMCHelmet
    CMUSurvivorWyPmcMedic:
    - ArmorHelmetPMC
    CMUSurvivorWyPmcEngineer:
    - ArmorHelmetPMCEngineer
    CMUSurvivorWyPmcLeader:
    - ArmorHelmetPMCOfficer
    CMUSurvivorWyPmcFieldOpsLeader:
    - ArmorHelmetPMCFieldOfficer
    CMUSurvivorWyPmcSupervisor:
    - RMCHeadCapManager
    CMUSurvivorWyPmcSynth:
    - ArmorHelmetPMCOfficer

