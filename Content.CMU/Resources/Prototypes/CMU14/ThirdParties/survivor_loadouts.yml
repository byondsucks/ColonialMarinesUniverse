    CMUSurvivorClfSpecOpsLeader:
    - RMCWeaponRifleM16A5
    - CMUWeaponRifleMAR30Tactical
    - CMUWeaponRifleMAR40Tactical
    - RMCWeaponShotgunHG3712
    CMUSurvivorClfSpecOpsOperative:
    - RMCWeaponRifleM16A5
    - CMUWeaponRifleMAR30Tactical
    - CMUWeaponRifleMAR40Tactical
    - RMCWeaponShotgunHG3712
    CMUSurvivorClfSpecOpsMedic:
    - CMU14WeaponSMGMP5SD
    CMUSurvivorClfSpecOpsTechnician:
    - RMCWeaponRifleM16A5
    - CMUWeaponRifleMAR30Tactical
    - CMUWeaponRifleMAR40Tactical
    - RMCWeaponShotgunHG3712
