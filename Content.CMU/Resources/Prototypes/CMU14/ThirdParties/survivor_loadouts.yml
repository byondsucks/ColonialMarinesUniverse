    - CMU14CLFSpecOpsArmorHunter
    CMUSurvivorClfSpecOpsOperative:
    - CMU14CLFCommandoArmor
    - CMU14CLFSpecOpsArmorHunter
    CMUSurvivorClfSpecOpsMedic:
    - CMU14CLFCommandoArmor
    - CMU14CLFSpecOpsArmorHunter
    CMUSurvivorClfSpecOpsTechnician:
    - CMU14CLFCommandoArmor
    - CMU14CLFSpecOpsArmorHunter
    CMUSurvivorClfSpecOpsHeavy:
    - CMU14CLFSpecOpsArmorHeavy
  roleHelmets:
