# --- DUTCH'S DOZEN ---
- type: survivorLoadout
  id: CMUDutchsDozenSurvivorLoadout
  factions:
  - CMUDutchsDozenSurvivors
  armor:
  - CMArmorDutchVest
  helmets:
  - RMCArmorHelmetDutch
  - RMCArmorHelmetDutchCap
  firearms:
  - CMUWeaponRifleXM177Dutch
  - CMUWeaponRifleM16A1UGL
  - RMCWeaponShotgunM37A1Filled
  - CMUWeaponMinigunOlPainless
  roleFirearms:
    CMUSurvDutchsDozenGrenadier:
    - CMUWeaponRifleXM177Dutch
    - CMUWeaponRifleM16A1UGL
    - RMCWeaponShotgunM37A1Filled
    CMUSurvDutchsDozenArnold:
    - CMUWeaponRifleXM177Dutch
    - RMCWeaponShotgunM37A1Filled
    CMUSurvDutchsDozenRifleman:
    - CMUWeaponRifleXM177Dutch
    - RMCWeaponShotgunM37A1Filled
    CMUSurvDutchsDozenMedic:
    - CMUWeaponRifleXM177Dutch
    - RMCWeaponShotgunM37A1Filled
    # The minigunner's GAU-19 rig is his identity: locked to it.
    CMUSurvDutchsDozenMinigunner:
    - CMUWeaponMinigunOlPainless
    # The M240-T rides in the Broiler-T harness on his back (its own item slot, not suit storage), so the flamer still
    # picks a primary weapon for suit storage exactly like the rest of the Dozen: the harness gun is kit, not a pick.
    CMUSurvDutchsDozenFlamer:
    - CMUWeaponRifleXM177Dutch
    - RMCWeaponShotgunM37A1Filled
  # The Dozen load armour-piercing 5.56mm; the swap converts every magazine they spawn with.
  firearmAmmo:
    # Survivors carry standard 5.56mm; SurvivorAmmoUpgrade converts 1-3 of those to AP. The call-in squad is
    # the group that arrives with everything AP. The M16A1 mapping was stale: the Dozen carry the XM177.
    CMUWeaponRifleXM177Dutch: RMCMagazineRifleM16
    CMUWeaponRifleM16A1UGL: RMCMagazineRifleM16
  roleArmor:
    CMUSurvDutchsDozenArnold:
    - CMArmorDutchVest
    CMUSurvDutchsDozenRifleman:
    - CMArmorDutchVest
    CMUSurvDutchsDozenMedic:
    - CMArmorDutchVest
    CMUSurvDutchsDozenGrenadier:
    - CMArmorDutchVest
    CMUSurvDutchsDozenMinigunner:
    - CMArmorDutchVest
    CMUSurvDutchsDozenFlamer:
    - CMArmorDutchVest
  roleHelmets:
    CMUSurvDutchsDozenArnold:
    - RMCArmorHelmetDutchCap
    CMUSurvDutchsDozenRifleman:
    - RMCArmorHelmetDutch
    CMUSurvDutchsDozenMedic:
    - RMCArmorHelmetDutch
    CMUSurvDutchsDozenGrenadier:
    - RMCArmorHelmetDutch
    CMUSurvDutchsDozenMinigunner:
    - RMCArmorHelmetDutch
    CMUSurvDutchsDozenFlamer:
    - RMCArmorHelmetDutch
