# ── Equipment ───────────────────────────────────────────────────────────────────────────────────────

# Standard: uniform, WY patch, knife boots, veteran gloves, gas mask, hvh headset, random (light suit +
# tactical cap + PMC combat backpack), MRE, metal sheet, M77 belt (the source's near-empty mod88 belt),
# WY survival pouch, WY ERT first-aid pouch. The source's rand(1,3) armour selection is documented in the
# header; this kit is its first option.
- type: startingGear
  parent: RMCGearSurvivorPMCBase
  id: CMUGearWyPmcStandard
  equipment:
    jumpsuit: RMCJumpsuitVeteranPMCNoWebbingPatch
    shoes: RMCBootsPMCFilled
    gloves: CMUHandsVeteranPMC
    mask: RMCMaskCoifPMC
    ears: RMCHeadsetHvHWeYaPMC
    outerClothing: CMArmorM4PMCLight
    head: ArmorHelmetPMC
    back: RMCSatchelPMC
    belt: RMCM77BeltPMCFilledNearEmpty
    pocket1: RMCPouchSurvivalBlackFilled
    pocket2: RMCPouchFirstAidPMCFill
  storage:
    # cmss13 keeps the MRE in the armour; CMU armour pockets are Tiny, so it rides in the pack.
    back:
    - CMSheetMetal20
    - RMCMREWeYa

# Synthetic: PMC uniform, black droppouch, light synth suit, telebaton, leader helmet, command headset,
# big sunglasses, white V42A1 smartpack (roller, surgical roller, mini extinguisher, upgraded defib, crew
# monitor, synth defib, radio), WY medical belt, tactical tools pouch, barbed-wire construction pouch.
#
# Differences from the source, all slot/prototype limits rather than guesses:
#  - the black droppouch is an accessory, and a startingGear slot cannot fill accessories; its contents
#    (manager scalpel, WY flask, zip cuffs) ride in the pack, and the WY patch accessory is dropped.
#  - lifesaver/wy/partial does not exist in CMU; the full WY-TM625 medical belt (RMCBeltMedicBagPMCFilled)
#    is issued instead (no new partial-fill variant is added).
#  - the tactical tools pouch is RMCPouchToolsSocFill, and the barbed-wire pouch is the RMC14 construction
#    pouch fill that carries BarbedWire15.
#  - tool/crew_monitor has no CMU prototype (same documented gap as the HIG port).
- type: startingGear
  parent: RMCGearSurvivorPMCBase
  id: CMUGearWyPmcSynth
  equipment:
    jumpsuit: RMCJumpsuitVeteranPMCNoWebbingPatch
    outerClothing: CMArmorM4PMCSynth
    shoes: RMCBootsPMCFilled
    gloves: CMUHandsVeteranPMC
    eyes: RMCSunglassesBig
    head: ArmorHelmetPMCOfficer
    ears: RMCHeadsetHvHWeYaPMCLeader
    belt: RMCBeltMedicBagPMCFilled
    back: RMCSmartpackA1White
    pocket1: RMCPouchToolsSocFill
    pocket2: RMCPouchConstructionFillLowGrade
  storage:
    back:
    - RMCMREWeYa
    - AU14TeleBaton
    - CMScalpelManager
    - CMWEYAFlask
    - RMCZipties
    - CMRollerBedSpawnFolded
    - CMPortableSurgicalBedSpawnFolded
    - CMFireExtinguisherPortable
    - AU14CMDefibrillator
    - CMUDefibrillatorCompactSynth

# The field operations leader inherits the Solaris commander kit, whose waist slot is an SMG holster belt. A
# holster belt both collides with the loadout's firearm pick and stacks extra pistols on top of the holsters his
# carrier uniform already has, so he wears a plain magazine belt filled with the carbine's own magazines.
# CMU has no W-Y-pattern magazine belt (the MK80 and M77 PMC belts are both holster rigs), so this is the
# standard black M16 magazine belt; the survivor AP upgrade converts a few of its magazines afterwards.
- type: startingGear
  parent: RMCGearSurvivorPMCCommander
  id: CMUGearWyPmcFieldOpsLeader
  equipment:
    # The commander preset wears the same officer-pattern balaclava.
    mask: CMUClothingMaskWYPMCOfficer
    # Issued empty: the survivor loadout fills it with the magazines of whichever firearm the player picks.
    belt: CMBeltMarine

# The cmss13 engineer survivor carries a welder satchel (storage on the back with the tool kit), not the
# heavy ERT welder backpack the call-in engineer uses.
- type: startingGear
  id: CMUGearWyPmcSurvEngineer
  parent: RMCGearSurvivorPMCEngineer
  equipment:
    back: RMCSatchelLightpackWelder

- type: job
  parent: RMCSurvivorSolarisPMCEngineer
  id: CMUJobWyPmcSurvEngineer
  special:
  - !type:AddComponentSpecial
    components:
    # The inherited Solaris preset puts the legacy access factions on the squad, which read as
    # "Weyland-Yutani Corp. (legacy)" and "Colonists (legacy)" on examine. The corporation's own faction is
    # the current one; a W-Y squad is not colonists.
    - type: NpcFactionMember
      factions:
      - AUWeYu
  startingGear: CMUGearWyPmcSurvEngineer

