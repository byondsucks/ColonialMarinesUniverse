# Weyland-Yutani PMC survivors: the corporate detachment the W-Y PMC survivor faction spawns.
#
# These are general W-Y PMC survivor roles, not a map-specific insert: any colony can roll the faction.
# The equipment mapping follows code/modules/gear_presets/survivors/solaris/crashlanding-offices_insert_bigred.dm
# (cmss13, commit ae42879bbb), presets pmc/standard, pmc/medic, pmc/engineer, pmc/pmc_leader,
# corporate/manager, synth/survivor/pmc and pmc/pmc_commander, because that file is where the source keeps
# the complete corporate squad.
#
# SCOPE: role bodies and the equipment of those roles only. Briefing/story text and a dedicated third-party
# prototype are not ported: the roles join the existing W-Y PMC survivor faction (CMUWYPMCSurvivors) through
# its party template and loadout.
#
# RMC14 already contains the six organic presets as roundstart survivor jobs with their gear
# (Resources/Prototypes/_RMC14/Roles/Jobs/Survivor/Solaris/Crashlanding_Offices/), ported from the same
# .dm file. Those jobs carry the equipment, so this file only adds the CMU role bodies that point at
# them, plus the one preset RMC14 is missing entirely: the PMC support synthetic.
#
# Mapping notes for the organic roles (RMC14's own port):
#  - suit/storage/marine/veteran/pmc/light, /light/bulletproof, /no_lamp -> CMArmorM4PMCLight,
#    RMCArmorM4PMCBulletProof, RMCArmorM4PMCNoLight; /engineer -> RMCArmorM4PMCEngineer;
#    /leader -> CMArmorM4PMCLeader; /light/synth -> CMArmorM4PMCSynth.
#  - helmet /pmc -> ArmorHelmetPMC, /black -> RMCArmorHelmetPMCBlack (RMC14 has no black tactical cap
#    in the standard preset yet), /enclosed -> RMCArmorHelmetPMCTactical, /enclosed/engineer ->
#    ArmorHelmetPMCEngineer, /leader -> ArmorHelmetPMCOfficer, /fieldleader -> ArmorHelmetPMCFieldOfficer.
#  - belt/gun/m4a3/wy/mod88_near_empty -> RMCM77BeltPMCFilledNearEmpty (the existing RMC14 prototype;
#    no new near-empty/partial variant is added).
#
# Grain of salt: the source rolls the standard preset's suit+helmet+backpack as one of three triplets
# (rand(1,3)). RMC14's random outfit preset still has TODOs for the bulletproof/no-lamp options and lists
# a weapon in an armour slot for the third, so the standard role below is written as a fixed kit
# (light suit + tactical cap, matching the source's first option) while keeping the random PMC weapon.

# ── Role bodies ─────────────────────────────────────────────────────────────────────────────────────

