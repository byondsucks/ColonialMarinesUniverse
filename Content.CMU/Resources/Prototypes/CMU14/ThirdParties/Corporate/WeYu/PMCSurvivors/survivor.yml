# ── Jobs ────────────────────────────────────────────────────────────────────────────────────────────
# Thin CMU aliases over RMC14's ported presets so the CMU survivor system has a stable, CMU-owned role id
# for every body. Equipment, skills, ranks, greeting and access are inherited from the RMC14 job.

- type: job
  parent: RMCSurvivorSolarisPMCStandard
  id: CMUJobWyPmcStandard
  hidden: false
  # RMC14's preset points at an undefined description key; use the existing military-survivor one.
  description: rmc-job-description-survivor-military
  # The source rolls the suit/helmet triplet; RMC14's random outfit preset is incomplete (see header),
  # so this role uses a fixed first-option kit plus the source's random PMC weapon preset.
  startingGear: CMUGearWyPmcStandard
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      preset: RMCSkillPresetSurvivorWeYaPMCStandard
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: RMCAllowSuitStorage
    - type: IntelRescueSurvivorObjective
    - type: EquipEntityPreset
      preset: RMCGearSurvivorPresetPMCGun
    - type: NpcFactionMember
      factions:
      - AUWeYu
    - type: JobPrefix
      prefix: rmc-job-prefix-pmc-standard

- type: job
  parent: RMCSurvivorSolarisPMCMedic
  id: CMUJobWyPmcMedic
  # Survivor skills: the inherited preset for this rank, so the squad is not skill-less.
  special:
  - !type:AddComponentSpecial
    components:
    # The inherited Solaris preset puts the legacy access factions on the squad, which read as
    # "Weyland-Yutani Corp. (legacy)" and "Colonists (legacy)" on examine. The corporation's own faction is
    # the current one; a W-Y squad is not colonists.
    - type: NpcFactionMember
      factions:
      - AUWeYu
    - type: Skills
      preset: RMCSkillPresetSurvivorWeYaPMCMedic
  # Own title: the inherited Solaris job reads as a legacy colonial survivor.
  name: rmc-job-name-pmc-medic
  description: rmc-job-description-survivor-military
  startingGear: CMUGearWyPmcMedic
  hidden: false

