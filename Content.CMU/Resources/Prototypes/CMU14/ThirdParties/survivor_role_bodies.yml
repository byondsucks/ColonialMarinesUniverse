# Survivor-only role bodies.
#
# Every survivor faction owns its role bodies outright: none of them is shared with the faction's ERT or
# third-party call-in counterpart, so survivor gear, skills and names can never leak into an ERT deployment
# (and vice versa). Each entry is a body wrapping its call-in counterpart's body, a job wrapping that job and a
# gear preset wrapping that gear - inheritance only, so behaviour matches until a survivor-specific override is
# added here.

# CMU14JobProdigySurvGoonLeader -> survivor-only body (ERT/call-in role stays CMU14JobCivilianProdigyGuardLeaderSurv).
- type: entity
  parent: CMU14JobProdigySurvGoonLeader
  id: CMUSurvProdigyGuardLeader
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: Prodigy Team Leader (survivor)
    description: au14-job-description-wyguard
    reregister: false
    job: CMUSurvivorJobProdigyGuardLeader
    raffle:
      settings: short

- type: job
  parent: CMU14JobCivilianProdigyGuardLeaderSurv
  id: CMUJobSurvProdigyGuardLeader
  startingGear: CMUGearSurvProdigyGuardLeader

- type: startingGear
  parent: AU14GearCivilianProdigyGuardLeaderSurv
  id: CMUGearSurvProdigyGuardLeader

