# Dedicated CMU jobs for every survivor role.
#
# A survivor role owns its job instead of borrowing the call-in job of the squad its faction also fields. The job
# decides the rank shown, the skills granted and - through JobPrototype.PlayTimeTracker - the playtime counter the
# role records against (SharedRoleSystem.MindGetAllRoleInfo reads job.PlayTimeTracker, and PlayTimeTrackingSystem
# indexes that tracker), so every job below has its own tracker, its own explicit skills and no call-in rank.
#
# Each job parents the role's previous job so its starting gear and identity are unchanged. roundComponents are
# re-emitted in full because a job's roundComponents list is *replaced*, not merged, when a child declares its own.


# --- AU14CLFSurvFighter (Rifleman) ---
- type: job
  parent: AU14JobCLFSurvFighter
  id: CMUSurvivorJobCLFSurvFighter
  # Its own counter: sharing the call-in job's tracker is what made two roles record the same playtime.
  playTimeTracker: CMUSurvivorJobCLFSurvFighter
  # Survivors are civilians and wear no rank chevrons, whatever their faction's call-in squads use.
  ranks:
    RMCRankCivilian: []
  roundComponents:
  - type: NpcFactionMember
    factions:
    - AUColonist
    - CLF
  - type: Skills
    skills:
      RMCSkillConstruction: 2
      RMCSkillEndurance: 1
      RMCSkillEngineer: 3
      RMCSkillFirearms: 3
      RMCSkillFireman: 1
      RMCSkillPolice: 1
      RMCSkillSpecialistWeapons: 1
      RMCSkillVehicles: 1

- type: playTimeTracker
  id: CMUSurvivorJobCLFSurvFighter

