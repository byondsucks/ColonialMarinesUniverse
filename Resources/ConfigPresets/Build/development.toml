# CMU14 owned custom configuration .toml file
#
# This loads whenever TOOLS is defined: Debug, DebugOpt and Tools builds; not Release
# LoadBuildConfigPresets() and config.preset_development=true config.preset_debug=true
[build]
engine_version = "v290.0.0"

[game]
defaultpreset = "Insurgency"
# Straight in-game baby
map = "USSBushRedux"
# TEMPORARY (survivor rework testing): keep the normal pre-round lobby so a round no longer starts the
# instant the server boots. Testers get the lobby countdown to connect and inspect the lobby, the
# gamemode/planet votes and the survivor setup before anyone spawns.
# The countdown is the standard game.lobbyduration timer; round-start rules (minimum players, ready
# state, pauses, the vote sequence) all still apply. Force an early start with the "startround" command.
# Restore the previous instant local start by setting lobbyenabled = false and deleting lobbyduration.
lobbyenabled = true
lobbyduration = 60 # 1 minute: quick round transitions while testing
role_timers = false
role_whitelist = false
admin_job_tracking = true
role_loadout_timers = false
auto_pause_empty = false

[cmu]
# enable in-game: "> cvar cmu.server_performance.log_enabled true"
server_performance.log_enabled = false

[cmu.game]
vote_start_delay = 0  # stops "Round start has been paused." on localhost

# CMU14 TEMPORARY (survivor rework testing): the survivor group vote draws from exactly these factions
# instead of the planet's survivor faction list, so the three test squads can be tried in-game at any
# population. Comma-separated third-party ids; empty = normal eligibility.
# This preset only loads in Debug/DebugOpt/Tools builds, so production servers are unaffected.
# Disable by emptying this value or deleting this block, then restart the server.
[cmu.survivor]
# CMU14 TEMPORARY (survivor rework testing): true puts every eligible survivor faction on the
# ballot instead of drawing two, so all of them can be voted for in one round. Set to false (the
# default) to restore the normal two-faction draw.
test_all_candidates = true
test_factions = "CMUProdigySurvivors,CMUWYPMCSurvivors,CMUCLFCommandoSurvivors,CMUUSArmySurvivors,CMUFORECONSurvivors,FreeCompanyRaidersSurv,CMUUNISCSurvivors,CMUDutchsDozenSurvivors"
# TEMPORARY (survivor rework testing): always schedule 8 survivors; -1 restores the lobby ratio.
test_count = 8

[rmc]
distress_xenos_minimum = 0  # stop blocking distress testing
lobby_min_players = 1       # localhost
dropship_hijack_initial_delay_minutes = 1
dropship_hijack_travel_time_seconds = 5

[events]
enabled = false

[ghost]
role_time = 0.5
quick_lottery = true

[movement]
mob_pushing = true

[net]
tickrate = 30
max_rapid_connections = 413
max_ip_connections = 413

# CMU14
[status]
# localhost only, matches the net.bindto flag in the ss14 wrapper
bind = "127.0.0.1:1212"

[physics]
# Makes mapping annoying
grid_splitting = false
maxlinvelocity = 72
target_minimum_tickrate = 90

[atmos]
space_wind = true
grid_impulse = true
max_process_time = 3

[explosion]
can_create_vacuum = false

[procgen]
preload = false

[salvage]
expedition_cooldown = 30.0

[shuttle]
grid_fill = true # Lifeboat & Escape Pods
auto_call_time = 0
emergency = false
arrivals = false
preload_grids = false

[afk]
time = 0

[admin]
afk_time = 0
see_own_notes = true
new_player_threshold = 120

# CMU14
[console]
# named host for non-loopback binds; loopback is auto-host via loginlocal anyway
login_host_user = "localhost@JoeGenero"

[ic]
# random_characters = true
random_species_weights = ""
ssd_sleep_time = 3600
id_job_length = 50

[database]
# Change to postgres if needed
engine = "sqlite"
pg_host = "localhost"
pg_port = 5432
pg_database = "ss14"
pg_username = "postgres"
pg_password = "postgres"
